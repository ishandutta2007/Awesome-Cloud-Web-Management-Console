<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <circle cx="200" cy="160" r="220" fill="url(#glow1)" />
  <circle cx="1000" cy="160" r="240" fill="url(#glow2)" />

  <g opacity="0.15">
    <path d="M0,200 Q300,120 600,200 T1200,200" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="d" values="M0,200 Q300,120 600,200 T1200,200; M0,200 Q300,280 600,200 T1200,200; M0,200 Q300,120 600,200 T1200,200" dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M0,100 Q400,220 800,100 T1200,100" fill="none" stroke="#818cf8" stroke-width="1.5">
      <animate attributeName="d" values="M0,100 Q400,220 800,100 T1200,100; M0,100 Q400,20 800,100 T1200,100; M0,100 Q400,220 800,100 T1200,100" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <g text-anchor="middle">
    <rect x="440" y="45" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="600" y="66" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">ULTIMATE CLOUD CONSOLES DIRECTORY</text>

    <text x="600" y="140" font-family="sans-serif" font-size="42" font-weight="800" fill="url(#text-grad)">Awesome Cloud Web Management Console</text>

    <text x="600" y="190" font-family="sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Curated Commercial Cloud Portals, Self-Hosted Dashboards &amp; Open-Source Control Planes</text>

    <g transform="translate(310, 230)">
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="85" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Multi-Cloud UI</text>

      <rect x="190" y="0" width="190" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="285" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Kubernetes &amp; K8s</text>

      <rect x="400" y="0" width="180" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="490" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">100% Open Source</text>
    </g>
  </g>
</svg>